version: "3.8"

services:
  web:
    stdin_open: true # So that the serving is not exited with code 0
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ENVIRONMENT: "PRODUCTION"
    environment:
      TIMER_BACKGROUND: https://wallpapercat.com/w/full/b/8/e/195983-2560x1600-desktop-hd-birthday-party-wallpaper-image.jpg
      TIMER_TARGET: "Sun Jan 03 2027 22:34:11 GMT+0100" # Get help with https://esqsoft.com/javascript_examples/date-to-epoch.htm
      TIMER_TITLE: "Nicolas's Day"
    ports:
      - "3000:3000"